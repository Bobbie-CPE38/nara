# Lint and test on every pull request, and on pushes to the shared branches.
# The steps mirror `make lint` and `make test`, so a green local run means a green CI run.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

# A newer push to the same branch or PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Same image and credentials as docker-compose.yml. Development-only values.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: staffing
          POSTGRES_USER: staffing
          POSTGRES_PASSWORD: staffing_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffing -d staffing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/conftest.py derives the test database (staffing_test) from this URL
      DATABASE_URL: postgresql+psycopg://staffing:staffing_dev@localhost:5432/staffing
      # Required by app.core.config (no default). Same value Compose derives from the default FRONTEND_PORT
      CORS_ORIGINS: '["http://localhost:3000"]'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend (typecheck, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test
