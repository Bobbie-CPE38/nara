# Times the OR-Tools solver on the problem sizes of round 2 contract section 4.6 and prints a table
# in the job summary. It measures: it never fails because the solver was slow.
# Run it by hand from the Actions tab, or let it run on a pull request that touches the solver.
#
# The Postgres service, env and install steps are copied from the backend job of ci.yml.
# This workflow is not named CI and its job does not reuse a job name of ci.yml, because those
# names are required status checks.
name: Solver timing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/app/optimization/**
      - backend/app/services/optimization_service.py
      - backend/tests/perf/**
      - .github/workflows/solver-timing.yml

permissions:
  contents: read

jobs:
  solver-timing:
    name: Solver timing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Same image and credentials as docker-compose.yml. Development-only values.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: staffing
          POSTGRES_USER: staffing
          POSTGRES_PASSWORD: staffing_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffing -d staffing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/conftest.py derives the test database (staffing_test) from this URL
      DATABASE_URL: postgresql+psycopg://staffing:staffing_dev@localhost:5432/staffing
      # Required by app.core.config (no default). Same value Compose derives from the default FRONTEND_PORT
      CORS_ORIGINS: '["http://localhost:3000"]'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The test writes its table to $GITHUB_STEP_SUMMARY as well as to the log
      - name: Time the solver
        env:
          SOLVER_TIMING: "1"
        run: pytest tests/perf -s -q
