# Layer for the AWS test machine (round 6 PR D, docs/deploy-aws.md). Used on top
# of the main file, with the env file that load-env.sh writes from Parameter Store:
#
#   docker compose --env-file /etc/nara/nara.env \
#     -f docker-compose.yml -f deploy/aws/docker-compose.aws.yml up -d
#
# Only Caddy publishes ports. Every other service is reachable inside the
# compose network only. `!reset` needs Docker Compose 2.24 or later.
#
# The frontend still runs the development server here. Round 6 PR F3 adds the
# production build (docs/workflow.md 6.30); the machine is not opened to the
# outside before that.

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must come from Parameter Store}

  redis:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-staffing}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must come from Parameter Store}@postgres:5432/${POSTGRES_DB:-staffing}
      # The pages and the API share one origin; this only covers direct calls
      CORS_ORIGINS: '["https://${SITE_DOMAIN:?SITE_DOMAIN must come from Parameter Store}"]'
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET:?INTERNAL_JOB_SECRET must come from Parameter Store}
      # Pinned off until round 6 PR E1 merges (docs/workflow.md 6.27): the old
      # explanation worker would call Bedrock for every plan on its own. PR E1
      # removes this line. The model trial (B2) does not need LLM_ENABLED
      LLM_ENABLED: "false"

  job:
    environment:
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET:?INTERNAL_JOB_SECRET must come from Parameter Store}

  frontend:
    ports: !reset []
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${SITE_DOMAIN:?SITE_DOMAIN must come from Parameter Store}/api

  caddy:
    image: caddy:2.10-alpine
    container_name: nara-staffing-caddy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN must come from Parameter Store}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must come from Parameter Store}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?BASIC_AUTH_USER must come from Parameter Store}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?BASIC_AUTH_HASH must come from Parameter Store}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; keeping them avoids asking Let's Encrypt again
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - staffing_net

volumes:
  caddy_data:
  caddy_config:
