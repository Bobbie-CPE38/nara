# Optional systemd drop-in for manually managed /etc/nara/nara.env.
# Install as /etc/systemd/system/nara.service.d/manual-env.conf.
# Do not install alongside an active Parameter Store deployment unintentionally:
# this disables fetching parameters on every service start.
[Service]
EnvironmentFile=
ExecStartPre=
ExecStartPre=/usr/bin/test -s /etc/nara/nara.env
