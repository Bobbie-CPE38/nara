# Development only. Keep secrets out of this file.
worker_processes 1;
events { worker_connections 128; }
http {
    access_log off;
    error_log /dev/stderr crit;
    # $request_uri is the ORIGINAL URI including arguments; $uri is normalized.
    # Case-sensitive regex: string keys in map are case-insensitive.
    # Query strings are deliberately denied, including /line/webhook?x=1.
    map "$request_method:$request_uri" $allowed_webhook {
        default 0;
        ~^POST:/line/webhook$ 1;
    }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;
        client_body_timeout 10s;
        location / {
            # A return-only if is intentional; never rewrite/normalize to allow.
            if ($allowed_webhook = 0) { return 404; }
            proxy_request_buffering on;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            # Only the original exact URI can reach this upstream.
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header X-Line-Signature $http_x_line_signature;
        }
    }
}
