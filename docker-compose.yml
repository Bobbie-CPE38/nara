services:
  postgres:
    image: postgres:17-alpine
    container_name: nara-staffing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staffing}
      POSTGRES_USER: ${POSTGRES_USER:-staffing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staffing_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-staffing} -d ${POSTGRES_DB:-staffing}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - staffing_net

  redis:
    image: redis:8-alpine
    container_name: nara-staffing-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped
    networks:
      - staffing_net

  backend:
    image: python:3.11-slim
    container_name: nara-staffing-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://staffing:staffing_dev@postgres:5432/staffing}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Follows FRONTEND_PORT unless CORS_ORIGINS is set in .env
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:${FRONTEND_PORT:-3000}"]}'
      # Shared with the job service. The default is for local development only
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET:-local-dev-only}
      PYTHONUNBUFFERED: "1"
      LINE_MODE: ${LINE_MODE:-simulation}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
    command: >
      sh -c "
      pip install --no-cache-dir -e ".[dev]" &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - staffing_net

  # Keeps the rhythm only: every 30 seconds it asks the backend to close what is
  # due. The backend decides with its own clock (docs/workflow.md, section 3.8)
  job:
    image: python:3.11-slim
    container_name: nara-staffing-job
    working_dir: /app
    volumes:
      - ./backend:/app:ro
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET:-local-dev-only}
      JOB_INTERVAL_SECONDS: ${JOB_INTERVAL_SECONDS:-30}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-m", "app.jobs.ticker"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - staffing_net

  frontend:
    image: node:24-alpine
    container_name: nara-staffing-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      # Follows BACKEND_PORT unless NEXT_PUBLIC_API_BASE_URL is set in .env
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}}
      WATCHPACK_POLLING: "true"
    command:
      - sh
      - -c
      - |
        npm ci &&
        exec npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    networks:
      - staffing_net

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  staffing_net:
    driver: bridge
